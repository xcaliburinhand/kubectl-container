name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch/PR supersedes a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: containers.internal/kubectl

# The kubectl-container runner forbids jobs without a job container, so every job names one. Override the
# images with repository variables KANIKO_IMAGE / CRANE_IMAGE (e.g. a mirror).
jobs:
  image:
    name: Image (Kaniko)
    runs-on: kubectl-container
    # Kaniko needs no Docker daemon. Its image is busybox-based, so JavaScript actions (actions/checkout)
    # cannot run in it: no checkout step, Kaniko fetches the commit itself via a git build context.
    container:
      image: ${{ vars.KANIKO_IMAGE || 'gcr.io/kaniko-project/executor:v1.23.2-debug' }}
    env:
      GIT_USERNAME: x-access-token
      GIT_PASSWORD: ${{ github.token }}
      CONTEXT: git://github.com/${{ github.repository }}.git#${{ github.ref }}#${{ github.sha }}
    steps:
      # Pull requests: build only, to prove the Dockerfile works.
      - name: Build (no push)
        if: github.event_name != 'push'
        shell: sh -e {0}
        run: /kaniko/executor --context "$CONTEXT" --dockerfile Dockerfile --no-push

      # master: push under the per-run tag only; latest moves after the tests pass.
      - name: Build and push candidate
        if: github.event_name == 'push'
        shell: sh -e {0}
        run: |
          /kaniko/executor --context "$CONTEXT" --dockerfile Dockerfile --skip-tls-verify \
            --destination "$REGISTRY:${{ github.run_number }}"

  # The runners have no Docker daemon, so the candidate image is the job container and the checks run inside it.
  test:
    name: Smoke test
    if: github.event_name == 'push'
    needs: [image]
    runs-on: kubectl-container
    container:
      image: containers.internal/kubectl:${{ github.run_number }}
    steps:
      - name: kubectl runs
        shell: sh -e {0}
        run: kubectl version --client
      - name: Bundled tools are present
        shell: sh -e {0}
        run: |
          curl --version | head -1
          jq --version
          openssl version

  # Replaces the :latest destination Jenkins pushed with the build. Retagging is a registry-side manifest copy,
  # so the image that was tested is exactly the image that gets promoted.
  promote:
    name: Promote (latest)
    needs: [test]
    runs-on: kubectl-container
    container:
      image: ${{ vars.CRANE_IMAGE || 'gcr.io/go-containerregistry/crane:debug' }}
    steps:
      - name: Retag
        shell: sh -e {0}
        run: crane tag --insecure "$REGISTRY:${{ github.run_number }}" latest
